<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="monitoring_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>monitoring_app</title>
  <link rel="manifest" href="manifest.json">

  <!-- HydroPulse splash styles -->
  <style>
    html, body { margin: 0; background: #FDFEEE; }
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #FDFEEE;
      font-family: 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      transition: opacity .25s ease;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    #splash img { width: 96px; height: 96px; border-radius: 24px; display: block; }
    #splash svg { margin: 36px 0 22px; }
    #splash .ecg {
      stroke-dasharray: 420;
      animation: splash-draw 2.2s ease-in-out infinite;
    }
    #splash .title { font-size: 18px; font-weight: 600; color: #1B2410; }
    #splash .sub { margin-top: 6px; font-size: 14px; color: #5C6356; }
    @keyframes splash-draw {
      0%   { stroke-dashoffset: 420; }
      60%  { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -420; }
    }
    @media (prefers-reduced-motion: reduce) {
      #splash .ecg { animation: none; stroke-dashoffset: 0; }
    }
  </style>
</head>
<body>
  <!-- HydroPulse splash: shown while Flutter loads, removed on first frame -->
  <div id="splash" role="status" aria-label="Loading">
    <img src="splash/logo.png" alt="HydroPulse">
    <svg width="240" height="60" viewBox="0 0 240 60" fill="none" aria-hidden="true">
      <path d="M0 30H80" stroke="#DDDCC8" stroke-width="3" stroke-linecap="round"/>
      <path d="M160 30H240" stroke="#DDDCC8" stroke-width="3" stroke-linecap="round"/>
      <path class="ecg" d="M0 30H80l10-6 10 6 12-26 14 52 12-26h14l8-6 8 6H240"
            stroke="#2E6B0E" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="title">Syncing your reservoir readings</div>
    <div class="sub">This only takes a moment</div>
  </div>
  <script>
    // Flutter fires this once the first frame is on screen.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.classList.add('hide');
      setTimeout(function () { s.remove(); }, 300);
    });
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
